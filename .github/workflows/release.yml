name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore (Optional Secrets)
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ntfysms_secret' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ntfysms_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'ntfysms_secret' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Find Release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.APK_PATH }}
          name: Release ${{ github.ref_name }}
          body: |
            ## NtfySMS Release ${{ github.ref_name }}
            
            ### Features & Updates
            - Dynamic SMS & Push Notification Forwarding to ntfy / Gotify target nodes.
            - Node-level pre-checks (Internet, Active VPN requirement, HTTP healthcheck ping).
            - Custom regex message parsing and custom payload format templates.
            - Manual retry & automatic real-time status notifications.
            
            ### Installation
            Download and install `NtfySMS-v1.0.0.apk` below on your Android device (Android 8.0+ / API 26+).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
