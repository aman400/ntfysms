name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore (Optional Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Integration Tests Before Release
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        env:
          INPUT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE=release.keystore
          export KEYSTORE_PASSWORD="${INPUT_KEYSTORE_PASSWORD:-zophop_secret}"
          export KEY_ALIAS="${INPUT_KEY_ALIAS:-zophop_key}"
          export KEY_PASSWORD="${INPUT_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          ./gradlew assembleRelease --stacktrace

      - name: Find Release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZopHop-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
