<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Z Emblem Gradient -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Hop Arrow Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)" />

  <!-- Concentric Rings -->
  <circle cx="54" cy="54" r="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

  <!-- ZopHop "Z" Emblem -->
  <path fill="url(#zGrad)" d="M34,36 L74,36 C77,36 78,39 76,41 L40,70 L74,70 C76,70 78,72 78,74 L78,74 C78,76 76,78 74,78 L34,78 C31,78 30,75 32,73 L68,44 L34,44 C32,44 30,42 30,40 L30,40 C30,38 32,36 34,36 Z" />

  <!-- Forward Hop Arc Arrow -->
  <path fill="none" stroke="url(#arcGrad)" stroke-width="3.5" stroke-linecap="round" d="M38,30 C48,22 60,22 70,30" />

  <!-- Node Dots -->
  <circle cx="34" cy="36" r="3.5" fill="#38BDF8" />
  <circle cx="74" cy="78" r="3.5" fill="#C084FC" />
</svg>
